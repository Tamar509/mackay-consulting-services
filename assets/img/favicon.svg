<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="mcs-mark-title">
  <title id="mcs-mark-title">Mackay Consulting Services</title>
  <!--
    PLACEHOLDER SQUARE MARK - replace with the supplied square logo.
    Used as the browser favicon. Also supply a 180x180 PNG named
    apple-touch-icon.png in this folder for iOS home screens.
  -->
  <rect width="64" height="64" fill="#F8F5EF"/>
  <rect x="3" y="3" width="58" height="58" fill="none" stroke="#B08D3F" stroke-width="2"/>
  <text x="32" y="41" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="24" letter-spacing="0.5" fill="#16181D">MCS</text>
</svg>
